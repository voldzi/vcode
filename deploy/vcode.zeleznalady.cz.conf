# Reference edge configuration. Adapt certificate and shared-snippet paths to
# the target environment; keep the actual infrastructure inventory private.
server {
    listen 80;
    listen [::]:80;
    server_name vcode.zeleznalady.cz;

    include /etc/nginx/snippets/letsencrypt.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name vcode.zeleznalady.cz;

    ssl_certificate /etc/letsencrypt/live/vcode.zeleznalady.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vcode.zeleznalady.cz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/security-headers-base.conf;

    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    send_timeout 30s;

    location / {
        proxy_pass http://vcode-web:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }
}
