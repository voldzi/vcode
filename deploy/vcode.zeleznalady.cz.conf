# Reference edge configuration. Adapt certificate and shared-snippet paths to
# the target environment; keep the actual infrastructure inventory private.
server {
    listen 80;
    listen [::]:80;
    server_name vcode.zeleznalady.cz;

    include /etc/nginx/snippets/letsencrypt.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name vcode.zeleznalady.cz;

    ssl_certificate /etc/letsencrypt/live/vcode.zeleznalady.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vcode.zeleznalady.cz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/security-headers-base.conf;

    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    send_timeout 30s;

    # Distribution traffic has aggregate counters in its dedicated service.
    # Disable individual access logs at every proxy layer for these paths.
    location ^~ /downloads/chromadb-status/ {
        access_log off;
        error_log /dev/null crit;
        proxy_pass http://vcode-web:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 120s;
        gzip off;
        proxy_pass_request_headers off;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header If-None-Match $http_if_none_match;
    }
    location = /analytics/download-intent {
        access_log off;
        error_log /dev/null crit;
        client_max_body_size 128;
        proxy_pass http://vcode-web:8080;
        proxy_pass_request_headers off;
        proxy_set_header Host $host;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Origin $http_origin;
        proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
        proxy_set_header DNT $http_dnt;
        proxy_set_header Sec-GPC $http_sec_gpc;
    }

    location = /api/contact/challenge {
        access_log off;
        error_log /dev/null crit;
        proxy_pass http://vcode-web:8080;
        proxy_pass_request_headers off;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /api/contact {
        access_log off;
        error_log /dev/null crit;
        client_max_body_size 16k;
        proxy_pass http://vcode-web:8080;
        proxy_pass_request_headers off;
        proxy_set_header Host $host;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Content-Encoding $http_content_encoding;
        proxy_set_header Origin $http_origin;
        proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://vcode-web:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }
}
