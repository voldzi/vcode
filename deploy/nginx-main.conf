worker_processes auto;
error_log /dev/stderr notice;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /dev/stdout main;

  sendfile on;
  keepalive_timeout 65;

  # Compress public text assets, including CSS/JS responses relayed by a proxy.
  # JSON API responses are intentionally outside this list. Distribution
  # locations explicitly disable gzip so artifact ranges/ETags remain exact.
  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_proxied any;
  gzip_types text/css text/javascript application/javascript
             application/xml text/xml application/rss+xml application/atom+xml
             application/manifest+json image/svg+xml;

  # Keep the private dashboard aligned with its service's strict CSP while
  # preserving the reviewed inline-style policy of the static portfolio.
  map $uri $vcode_content_security_policy {
    default "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self' mailto:";
    ~^/prehled(?:/|$) "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'";
  }

  # Location-scoped add_header would suppress inherited security headers.
  # Hashed assets stay immutable; static HTML revalidates before reuse so
  # a previous portfolio release cannot remain fresh by browser heuristics.
  # Proxied services retain their reviewed cache policy.
  map $uri $vcode_asset_cache_control {
    default "";
    ~^/_astro/ "public, immutable";
    ~^/(?:prehled|api|analytics|blog|blog-assets|downloads|internal)(?:/|$) "";
    ~^/en/blog(?:/|$) "";
    ~\.html$ "no-cache";
  }

  include /etc/nginx/conf.d/*.conf;
}
