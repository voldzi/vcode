pid /tmp/nginx.pid;
worker_processes 1;
error_log /dev/null crit;
events { worker_connections 256; }
http {
  access_log off;
  server_tokens off;
  client_max_body_size 16k;
  client_body_buffer_size 32k;
  client_body_temp_path /tmp/body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_body_timeout 10s;
  send_timeout 10s;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 8443 ssl;
    server_name vcode-partnership-intake;
    ssl_certificate /run/partnership-tls/server.pem;
    ssl_certificate_key /run/partnership-tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    ssl_session_cache shared:partnership:1m;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    set $partnership_backend http://blog:8090;
    if ($args != "") { return 400; }
    proxy_connect_timeout 3s;
    proxy_read_timeout 8s;
    proxy_send_timeout 8s;
    # Preserve unknown Sec-Fetch-* metadata for the central rejection guard.
    # Suppress origin address, forwarding, referral and administration fields.
    proxy_pass_request_headers on;
    proxy_set_header Host blog;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Content-Type $http_content_type;
    proxy_set_header Content-Encoding $http_content_encoding;
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header Forwarded "";
    proxy_set_header Referer "";
    proxy_set_header User-Agent "";
    proxy_set_header X-VCode-Admin-Id "";
    # Keep browser context for the service's rejection checks. Real relay
    # requests contain none, except Node's generated Sec-Fetch-Mode:cors.
    proxy_set_header Origin $http_origin;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Sec-Fetch-Mode $http_sec_fetch_mode;
    proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
    proxy_set_header Sec-Fetch-Dest $http_sec_fetch_dest;
    proxy_set_header Sec-Fetch-User $http_sec_fetch_user;
    proxy_hide_header Cache-Control;
    location = /health { return 200 'ok'; }
    location = /internal/partnerships/v1/challenge {
      if ($request_method != POST) { return 405; }
      proxy_pass $partnership_backend;
    }
    location = /internal/partnerships/v1/submissions {
      if ($request_method != POST) { return 405; }
      proxy_pass $partnership_backend;
    }
    location / { return 404; }
  }
}
