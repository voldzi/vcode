services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: ${ANALYTICS_DB_PASSWORD:?Configure a dedicated password}
    volumes:
      - analytics-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d analytics"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [analytics]
  umami:
    image: ghcr.io/umami-software/umami:3.4.0
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://analytics:${ANALYTICS_DB_PASSWORD}@database:5432/analytics
      APP_SECRET: ${ANALYTICS_APP_SECRET:?Configure an independent secret}
      TWO_FACTOR_ENCRYPTION_KEY: ${ANALYTICS_2FA_KEY:?Configure an independent secret}
      PRIVATE_MODE: "1"
      DISABLE_TELEMETRY: "1"
      SALT_ROTATION: day
      CLIENT_IP_HEADER: x-real-ip
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/heartbeat',{signal:AbortSignal.timeout(5000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [analytics]
  retention:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: database
      PGUSER: analytics
      PGDATABASE: analytics
      PGPASSWORD: ${ANALYTICS_DB_PASSWORD}
    volumes:
      - ./retention.sql:/run/config/retention.sql:ro
    entrypoint: ["sh", "-c", "while true; do psql -v ON_ERROR_STOP=1 -f /run/config/retention.sql && sleep 86400 || sleep 300; done"]
    depends_on:
      database:
        condition: service_healthy
    networks: [analytics]
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: database
      PGUSER: analytics
      PGDATABASE: analytics
      PGPASSWORD: ${ANALYTICS_DB_PASSWORD}
    volumes:
      - ./backup.sh:/run/config/backup.sh:ro
      - ${ANALYTICS_BACKUP_PATH:?Configure private backup directory}:/backups
    entrypoint: ["sh", "/run/config/backup.sh"]
    depends_on:
      database:
        condition: service_healthy
    networks: [analytics]
  privacy-policy:
    image: postgres:17-alpine
    restart: on-failure
    environment:
      PGHOST: database
      PGUSER: analytics
      PGDATABASE: analytics
      PGPASSWORD: ${ANALYTICS_DB_PASSWORD}
    volumes:
      - ./privacy.sql:/run/config/privacy.sql:ro
    entrypoint: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/run/config/privacy.sql"]
    depends_on:
      umami:
        condition: service_healthy
    networks: [analytics]
  collector:
    build:
      context: ../..
      dockerfile: Dockerfile.analytics
    command: ["node", "services/analytics/collector.mjs"]
    restart: unless-stopped
    read_only: true
    environment:
      ANALYTICS_UPSTREAM: http://umami:3000
      ANALYTICS_SITES_FILE: /run/config/sites.json
    volumes:
      - ${ANALYTICS_SITES_PATH:?Configure site registry}:/run/config/sites.json:ro
    ports:
      - "${ANALYTICS_BIND_ADDRESS:-127.0.0.1}:${ANALYTICS_COLLECTOR_PORT:-18094}:8092"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      privacy-policy:
        condition: service_completed_successfully
    networks: [analytics]
  monitor:
    build:
      context: ../..
      dockerfile: Dockerfile.analytics
    command: ["node", "services/analytics/monitor.mjs"]
    restart: unless-stopped
    read_only: true
    environment:
      ANALYTICS_SITES_FILE: /run/config/sites.json
      ANALYTICS_STATUS_FILE: /state/connections.json
    volumes:
      - ${ANALYTICS_SITES_PATH:?Configure site registry}:/run/config/sites.json:ro
      - ${ANALYTICS_STATE_PATH:?Configure private monitoring directory}:/state
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [analytics]
  dashboard:
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8091/health',{signal:AbortSignal.timeout(5000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    build:
      context: ../..
      dockerfile: Dockerfile.analytics
    restart: unless-stopped
    read_only: true
    environment:
      ANALYTICS_UPSTREAM: http://umami:3000
      PUBLIC_SITE_URL: https://vcode.zeleznalady.cz
      ANALYTICS_STATUS_FILE: /state/connections.json
      ANALYTICS_COLLECTION_ENABLED: ${ANALYTICS_COLLECTION_ENABLED:-false}
      ANALYTICS_SITES_FILE: /run/config/sites.json
    volumes:
      - ${ANALYTICS_SITES_PATH:?Configure site registry}:/run/config/sites.json:ro
      - ${ANALYTICS_STATE_PATH:?Configure private monitoring directory}:/state:ro
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks:
      analytics:
      vcode:
        aliases: [vcode-analytics]
networks:
  analytics:
  vcode:
    external: true
    name: ${VCODE_NETWORK:?Configure the existing web network}
volumes:
  analytics-data:
