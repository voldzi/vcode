# Server-level named handlers used only by relay-local error_page rules.
location @contact_relay_invalid_input {
  internal;
  access_log off;
  error_log /dev/null crit;
  default_type application/json;
  include /etc/nginx/contact-relays/api-security-headers.conf;
  return 400 '{"ok":false,"error":"invalid-input"}';
}
location @contact_relay_origin_not_allowed {
  internal;
  access_log off;
  error_log /dev/null crit;
  default_type application/json;
  include /etc/nginx/contact-relays/api-security-headers.conf;
  return 403 '{"ok":false,"error":"origin-not-allowed"}';
}
location @contact_relay_not_found {
  internal;
  access_log off;
  error_log /dev/null crit;
  default_type application/json;
  include /etc/nginx/contact-relays/api-security-headers.conf;
  return 404 '{"ok":false,"error":"not-found"}';
}
location @contact_relay_method_not_allowed {
  internal;
  access_log off;
  error_log /dev/null crit;
  default_type application/json;
  include /etc/nginx/contact-relays/api-security-headers.conf;
  return 405 '{"ok":false,"error":"method-not-allowed"}';
}
location @contact_relay_too_large {
  internal;
  access_log off;
  error_log /dev/null crit;
  default_type application/json;
  include /etc/nginx/contact-relays/api-security-headers.conf;
  return 413 '{"ok":false,"error":"too-large"}';
}
location @contact_relay_invalid_content_type {
  internal;
  access_log off;
  error_log /dev/null crit;
  default_type application/json;
  include /etc/nginx/contact-relays/api-security-headers.conf;
  return 415 '{"ok":false,"error":"invalid-content-type"}';
}
location @contact_relay_unavailable {
  internal;
  access_log off;
  error_log /dev/null crit;
  default_type application/json;
  include /etc/nginx/contact-relays/api-security-headers.conf;
  add_header Retry-After "60" always;
  return 503 '{"ok":false,"error":"unavailable"}';
}
