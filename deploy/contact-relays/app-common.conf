# Used only by the two exact public contact locations.
access_log off;
error_log /dev/null crit;
include /etc/nginx/contact-relays/api-security-headers.conf;
client_max_body_size 16k;
client_body_buffer_size 32k;
client_body_timeout 10s;
send_timeout 10s;
if ($contact_relay_trusted_edge != 1) { return 403; }
if ($contact_relay_client_ip = "") { return 403; }
if ($http_host != "mestemhrou.cz") { return 403; }
if ($http_sec_fetch_site != "same-origin") { return 403; }
if ($args != "") { return 400; }

resolver 127.0.0.11 valid=10s ipv6=off;
set $contact_relay_upstream https://vcode-contact-relay:8443;
proxy_http_version 1.1;
proxy_pass_request_headers off;
proxy_set_header Host vcode-contact-relay;
proxy_set_header Connection "";
include /run/contact-relay/authorization.conf;
proxy_set_header Origin "https://mestemhrou.cz";
proxy_set_header Sec-Fetch-Site "same-origin";
proxy_set_header X-Real-IP $contact_relay_client_ip;
proxy_set_header Content-Type $http_content_type;
proxy_set_header Content-Encoding $http_content_encoding;
proxy_ssl_server_name on;
proxy_ssl_name vcode-contact-relay;
proxy_ssl_verify on;
proxy_ssl_verify_depth 2;
proxy_ssl_trusted_certificate /run/contact-relay/ca.pem;
proxy_connect_timeout 3s;
proxy_read_timeout 8s;
proxy_send_timeout 8s;
proxy_cache off;
proxy_buffering off;
proxy_request_buffering on;
proxy_max_temp_file_size 0;
proxy_intercept_errors off;
proxy_hide_header Cache-Control;
proxy_hide_header Content-Security-Policy;
proxy_hide_header Referrer-Policy;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Robots-Tag;
proxy_hide_header Set-Cookie;
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Credentials;
proxy_hide_header Access-Control-Allow-Methods;
proxy_hide_header Access-Control-Allow-Headers;
proxy_hide_header Access-Control-Expose-Headers;
proxy_hide_header Access-Control-Max-Age;
