pid /tmp/nginx.pid;
worker_processes 1;
error_log /dev/null crit;
events { worker_connections 256; }
http {
  access_log off;
  server_tokens off;
  client_max_body_size 16k;
  client_body_buffer_size 32k;
  client_body_temp_path /tmp/body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_body_timeout 10s;
  send_timeout 10s;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 8443 ssl;
    server_name vcode-contact-relay;
    ssl_certificate /run/contact-relay-tls/server.pem;
    ssl_certificate_key /run/contact-relay-tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    ssl_session_cache shared:contact_relay:1m;
    include /etc/nginx/contact-relays/api-security-headers.conf;
    include /etc/nginx/contact-relays/error-pages.conf;
    if ($http_host != "vcode-contact-relay") { return 403; }
    if ($args != "") { return 400; }
    set $contact_relay_backend http://blog:8090;
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 8s;
    proxy_send_timeout 8s;
    proxy_pass_request_headers off;
    proxy_set_header Host blog;
    proxy_set_header Connection "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Origin $http_origin;
    proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
    proxy_set_header X-Real-IP $http_x_real_ip;
    proxy_set_header Content-Type $http_content_type;
    proxy_set_header Content-Encoding $http_content_encoding;
    proxy_cache off;
    proxy_buffering off;
    proxy_request_buffering on;
    proxy_max_temp_file_size 0;
    proxy_intercept_errors off;
    proxy_hide_header Cache-Control;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Robots-Tag;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Access-Control-Max-Age;
    location = /health {
      if ($request_method != GET) { return 405; }
      default_type application/json;
      return 200 '{"ok":true}';
    }
    location = /internal/contact-relays/v1/challenge {
      if ($request_uri != "/internal/contact-relays/v1/challenge") { return 400; }
      if ($request_method != GET) { return 405; }
      if ($content_length != "") { return 400; }
      if ($http_transfer_encoding != "") { return 400; }
      proxy_pass_request_body off;
      proxy_pass $contact_relay_backend;
    }
    location = /internal/contact-relays/v1/submissions {
      if ($request_uri != "/internal/contact-relays/v1/submissions") { return 400; }
      if ($request_method != POST) { return 405; }
      proxy_pass $contact_relay_backend;
    }
    location / { return 404; }
  }
}
