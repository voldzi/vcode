server {
  listen 8080;
  server_name _;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $blog_upstream http://blog:8090;
  root /usr/share/nginx/html;
  index index.html;

  location = /health { access_log off; default_type text/plain; return 200 'ok'; }
  location = /health/blog {
    access_log off;
    proxy_pass $blog_upstream;
    proxy_set_header Host $host;
  }
  location ^~ /blog-assets/ {
    proxy_pass $blog_upstream;
    proxy_set_header Host $host;
  }
  location ~ ^/(en/)?blog(?:/|$) {
    proxy_pass $blog_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location ^~ /api/blog/ {
    client_max_body_size 20k;
    proxy_pass $blog_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /blog-sitemap.xml {
    proxy_pass $blog_upstream;
    proxy_set_header Host $host;
  }
  location / { try_files $uri $uri/ $uri/index.html =404; }
  location /_astro/ { expires 1y; add_header Cache-Control "public, immutable"; }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self' mailto:" always;
}
