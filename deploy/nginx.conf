server {
  listen 8080;
  server_name _;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $blog_upstream http://blog:8090;
  # Owner-approved release 0.6.0-202610081600; accepted catalogue and reviewed notices.
  set $downloads_enabled 1;
  root /usr/share/nginx/html;
  index index.html;

  location = /health { access_log off; default_type text/plain; return 200 'ok'; }
  location = /health/blog {
    access_log off;
    proxy_pass $blog_upstream;
    proxy_set_header Host $host;
  }
  location ^~ /blog-assets/ {
    proxy_pass $blog_upstream;
    proxy_set_header Host $host;
  }
  location ~ ^/(en/)?blog(?:/|$) {
    proxy_pass $blog_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location ^~ /api/blog/ {
    client_max_body_size 20k;
    proxy_pass $blog_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /blog-sitemap.xml {
    proxy_pass $blog_upstream;
    proxy_set_header Host $host;
  }
  location = /prehled { return 302 /prehled/; }
  location ^~ /prehled/ {
    set $analytics_upstream http://vcode-analytics:8091;
    proxy_pass $analytics_upstream;
    # Replace the service header with the same strict policy selected above.
    # The server-level add_header remains inherited on every status code.
    proxy_hide_header Content-Security-Policy;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_x_forwarded_for;
    access_log off;
  }
  location = /analytics/tracker.js {
    set $analytics_upstream http://vcode-analytics:8091;
    proxy_pass $analytics_upstream;
    access_log off;
  }
  location = /analytics/event {
    client_max_body_size 4k;
    set $analytics_upstream http://vcode-analytics:8091;
    proxy_pass $analytics_upstream;
    proxy_set_header X-Real-IP $http_x_forwarded_for;
    access_log off;
  }
  location ^~ /downloads/chromadb-status/ {
    access_log off;
    error_log /dev/null crit;
    if ($downloads_enabled = 0) { return 404; }
    set $downloads_upstream http://downloads:8096;
    proxy_pass $downloads_upstream;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 120s;
    gzip off;
    proxy_pass_request_headers off;
    proxy_set_header Host $host;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_set_header If-None-Match $http_if_none_match;
  }
  location = /analytics/download-intent {
    access_log off;
    error_log /dev/null crit;
    if ($downloads_enabled = 0) { return 404; }
    client_max_body_size 128;
    set $downloads_upstream http://downloads:8096;
    proxy_pass $downloads_upstream;
    proxy_pass_request_headers off;
    proxy_set_header Host $host;
    proxy_set_header Content-Type $http_content_type;
    proxy_set_header Origin $http_origin;
    proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
    proxy_set_header DNT $http_dnt;
    proxy_set_header Sec-GPC $http_sec_gpc;
  }
  # Local-only working previews never resolve on the public server.
  location ^~ /preview-local/ { access_log off; return 404; }
  location / { try_files $uri $uri/ $uri/index.html =404; }
  location /_astro/ { expires 1y; }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy $vcode_content_security_policy always;
  add_header Cache-Control $vcode_asset_cache_control;
}
